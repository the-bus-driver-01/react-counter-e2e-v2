<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake Claude API — Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Top navigation bar -->
  <header class="header">
    <div class="header__brand">
      <h1 class="header__title">Fake Claude API</h1>
      <span class="header__badge" id="status-badge">Offline</span>
    </div>
    <nav class="header__nav">
      <a href="#dashboard" class="nav-link active" data-section="dashboard">Dashboard</a>
      <a href="#logs" class="nav-link" data-section="logs">Logs</a>
      <a href="#settings" class="nav-link" data-section="settings">Settings</a>
    </nav>
  </header>

  <!-- Main content area -->
  <main class="main">
    <!-- Dashboard section -->
    <section class="section" id="section-dashboard">
      <div class="stats">
        <div class="stat-card">
          <span class="stat-card__value" id="stat-requests">0</span>
          <span class="stat-card__label">Requests</span>
        </div>
        <div class="stat-card">
          <span class="stat-card__value" id="stat-streaming">0</span>
          <span class="stat-card__label">Streaming</span>
        </div>
        <div class="stat-card">
          <span class="stat-card__value" id="stat-errors">0</span>
          <span class="stat-card__label">Errors</span>
        </div>
        <div class="stat-card">
          <span class="stat-card__value" id="stat-uptime">—</span>
          <span class="stat-card__label">Uptime</span>
        </div>
      </div>

      <div class="panel">
        <h2 class="panel__title">Recent Requests</h2>
        <div class="panel__body">
          <table class="table" id="requests-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>Method</th>
                <th>Path</th>
                <th>Model</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr class="table__empty-row">
                <td colspan="5">No requests yet</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Logs section (hidden by default) -->
    <section class="section hidden" id="section-logs">
      <div class="panel">
        <div class="panel__header">
          <h2 class="panel__title">Server Logs</h2>
          <button class="btn btn--secondary" id="clear-logs-btn">Clear</button>
        </div>
        <div class="panel__body">
          <pre class="log-output" id="log-output">Waiting for log data…</pre>
        </div>
      </div>
    </section>

    <!-- Settings section (hidden by default) -->
    <section class="section hidden" id="section-settings">
      <div class="panel">
        <h2 class="panel__title">Server Configuration</h2>
        <div class="panel__body">
          <div class="form-group">
            <label class="form-label" for="setting-port">Port</label>
            <input class="form-input" type="number" id="setting-port" value="4321" readonly>
          </div>
          <div class="form-group">
            <label class="form-label" for="setting-base-url">Base URL</label>
            <input class="form-input" type="text" id="setting-base-url" value="http://localhost:4321" readonly>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>Fake Claude API &mdash; Proxy <code>claude -p</code> behind the Anthropic Messages API</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
