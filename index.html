<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake Claude API — Chat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <h1>Fake Claude API</h1>
      <div class="header-controls">
        <label for="model-select">Model:</label>
        <select id="model-select">
          <option value="claude-sonnet-4-20250514">Sonnet</option>
          <option value="claude-opus-4-20250514">Opus</option>
          <option value="claude-haiku-4-20250514">Haiku</option>
        </select>
        <label class="toggle">
          <input type="checkbox" id="stream-toggle" checked>
          <span>Stream</span>
        </label>
        <span class="status" id="connection-status" title="Server status">●</span>
      </div>
    </header>

    <!-- Messages area -->
    <main class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <p>Send a message to get started.</p>
        <p class="subtle">Requests are proxied through <code>claude -p</code>.</p>
      </div>
    </main>

    <!-- Input area -->
    <form class="input-area" id="input-form">
      <textarea
        id="user-input"
        placeholder="Type a message…"
        rows="1"
        autofocus
      ></textarea>
      <button type="submit" id="send-btn" title="Send message">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
