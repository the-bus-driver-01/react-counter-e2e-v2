<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake Claude API Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container">
      <h1 class="header__title">Fake <span>Claude</span> API</h1>
      <div class="status-badge" id="statusBadge">
        <span class="status-badge__dot" id="statusDot"></span>
        <span id="statusText">Checking...</span>
      </div>
    </div>
  </header>

  <main>
    <div class="container">

      <!-- Config Section -->
      <section class="section">
        <h2 class="section__title">Configuration</h2>
        <div class="card">
          <form id="configForm" novalidate>
            <div class="config-grid">
              <div class="form-group">
                <label for="portInput">Server Port</label>
                <input type="number" id="portInput" value="4321" min="1" max="65535" inputmode="numeric">
                <span class="error-msg" id="portError"></span>
              </div>
              <div class="form-group">
                <label for="baseUrlInput">Base URL</label>
                <input type="url" id="baseUrlInput" value="http://localhost:4321" placeholder="http://localhost:4321">
                <span class="error-msg" id="baseUrlError"></span>
              </div>
              <div class="form-group">
                <label for="modelSelect">Default Model</label>
                <select id="modelSelect">
                  <option value="claude-opus-4-6">claude-opus-4-6</option>
                  <option value="claude-sonnet-4-6" selected>claude-sonnet-4-6</option>
                  <option value="claude-haiku-4-5-20251001">claude-haiku-4-5</option>
                </select>
              </div>
            </div>
            <div class="btn-group" style="margin-top: 16px;">
              <button type="submit" class="btn btn--primary">Save Config</button>
              <button type="button" class="btn" id="checkBtn">Check Status</button>
            </div>
          </form>
        </div>
      </section>

      <!-- Stats Section -->
      <section class="section">
        <h2 class="section__title">Statistics</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-card__value" id="totalRequests">0</div>
            <div class="stat-card__label">Total Requests</div>
          </div>
          <div class="stat-card">
            <div class="stat-card__value" id="successCount">0</div>
            <div class="stat-card__label">Successful</div>
          </div>
          <div class="stat-card">
            <div class="stat-card__value" id="errorCount">0</div>
            <div class="stat-card__label">Errors</div>
          </div>
          <div class="stat-card">
            <div class="stat-card__value" id="avgLatency">-</div>
            <div class="stat-card__label">Avg Latency</div>
          </div>
        </div>
      </section>

      <!-- Request Log Section -->
      <section class="section">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
          <h2 class="section__title" style="margin-bottom: 0;">Request Log</h2>
          <button class="btn" id="clearLogBtn">Clear</button>
        </div>
        <div class="log" id="requestLog" role="log" aria-live="polite" aria-label="Request log">
          <div class="log__empty" id="logEmpty">No requests yet. Start your app to see traffic.</div>
        </div>
      </section>

    </div>
  </main>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer" aria-live="assertive"></div>

  <script src="app.js"></script>
</body>
</html>
